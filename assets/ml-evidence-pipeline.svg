<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Machine learning evidence pipeline</title><desc id="d">Planned visual pipeline for data splitting, modeling, evaluation, uncertainty and bounded claims. All stages are explicitly marked as a future evidence standard rather than implemented project results.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172238"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#94a3b8"/></marker></defs><rect width="1600" height="720" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="70" fill="#f3f6fa" font-size="31" font-weight="800">MACHINE LEARNING — EVIDENCE PIPELINE</text><text x="70" y="103" fill="#aebdcd" font-size="16">planned repository standard · not presented as completed ML research</text>
<g font-size="13" font-weight="700"><rect x="70" y="160" width="190" height="100" rx="16" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="165" y="198" text-anchor="middle" fill="#fff">DATA</text><text x="165" y="220" text-anchor="middle" fill="#c7d2fe" font-size="11">source · units · rights</text><text x="165" y="239" text-anchor="middle" fill="#c7d2fe" font-size="11">missingness · target</text><rect x="320" y="160" width="190" height="100" rx="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/><text x="415" y="198" text-anchor="middle" fill="#fff">SPLIT</text><text x="415" y="220" text-anchor="middle" fill="#bae6fd" font-size="11">train / validation / test</text><text x="415" y="239" text-anchor="middle" fill="#bae6fd" font-size="11">leakage controls</text><rect x="570" y="160" width="190" height="100" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="665" y="198" text-anchor="middle" fill="#fff">MODEL</text><text x="665" y="220" text-anchor="middle" fill="#bbf7d0" font-size="11">fθ(x) · loss L(θ)</text><text x="665" y="239" text-anchor="middle" fill="#bbf7d0" font-size="11">baseline first</text><rect x="820" y="160" width="190" height="100" rx="16" fill="#78350f" stroke="#fbbf24" stroke-width="2"/><text x="915" y="198" text-anchor="middle" fill="#fff">EVALUATE</text><text x="915" y="220" text-anchor="middle" fill="#fde68a" font-size="11">metric + baseline</text><text x="915" y="239" text-anchor="middle" fill="#fde68a" font-size="11">out-of-sample</text><rect x="1070" y="160" width="190" height="100" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="1165" y="198" text-anchor="middle" fill="#fff">UNCERTAINTY</text><text x="1165" y="220" text-anchor="middle" fill="#fecdd3" font-size="11">intervals · calibration</text><text x="1165" y="239" text-anchor="middle" fill="#fecdd3" font-size="11">sensitivity</text><rect x="1320" y="160" width="210" height="100" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="1425" y="198" text-anchor="middle" fill="#fff">BOUND CLAIM</text><text x="1425" y="220" text-anchor="middle" fill="#dce5ed" font-size="11">what result supports</text><text x="1425" y="239" text-anchor="middle" fill="#dce5ed" font-size="11">what it does not</text></g><path d="M260 210H320M510 210H570M760 210H820M1010 210H1070M1260 210H1320" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="70" y="320" width="700" height="280" rx="20" fill="#101d31" stroke="#475569"/><text x="96" y="358" fill="#d8e1ea" font-size="19" font-weight="700">Mathematical objects expected in a mature project</text><text x="96" y="398" fill="#e5e7eb" font-size="16">Supervised objective:  θ* = arg minθ Σᵢ ℓ(fθ(xᵢ), yᵢ) + λΩ(θ)</text><text x="96" y="430" fill="#e5e7eb" font-size="16">Generalization estimate:  R̂test = ntest⁻¹ Σ ℓ(fθ(xᵢ), yᵢ)</text><text x="96" y="462" fill="#e5e7eb" font-size="16">Calibration / probability:  P(Y=1 | p̂≈p) ≈ p</text><line x1="105" y1="552" x2="725" y2="552" stroke="#5b6b7c"/><line x1="105" y1="552" x2="105" y2="490" stroke="#5b6b7c"/><path d="M110 540 C190 521,250 510,340 505 C440 498,530 507,620 525 S690 540,720 535" fill="none" stroke="#38bdf8" stroke-width="3"/><line x1="105" y1="520" x2="725" y2="520" stroke="#34d399" stroke-dasharray="7 5"/><text x="560" y="512" fill="#86efac" font-size="11">reference / calibrated line</text>
<rect x="830" y="320" width="700" height="280" rx="20" fill="#101d31" stroke="#475569"/><text x="856" y="358" fill="#d8e1ea" font-size="19" font-weight="700">Promotion gate from scaffold → evidence-bearing</text><g font-size="14"><text x="870" y="405" fill="#f8fafc">1  executable code + environment</text><text x="870" y="440" fill="#f8fafc">2  source/data provenance</text><text x="870" y="475" fill="#f8fafc">3  baseline + declared split strategy</text><text x="870" y="510" fill="#f8fafc">4  metrics + uncertainty + sensitivity</text><text x="870" y="545" fill="#f8fafc">5  reproducible figures/results + limitations</text></g><rect x="1215" y="400" width="250" height="115" rx="16" fill="#1f2937" stroke="#64748b" stroke-dasharray="7 6"/><text x="1340" y="438" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">CURRENT STATUS</text><text x="1340" y="468" text-anchor="middle" fill="#cbd5e1" font-size="13">learning scaffold</text><text x="1340" y="493" text-anchor="middle" fill="#94a3b8" font-size="12">no public model results yet</text><text x="70" y="660" fill="#9aaaba" font-size="14">The visual is a quality contract for future work, not evidence that the stages have already been executed.</text></g></svg>