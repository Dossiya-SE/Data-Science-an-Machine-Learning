<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Machine learning evidence pipeline</title><desc id="desc">Adaptive light and dark planned quality pipeline for data provenance, honest splitting, modeling, evaluation, uncertainty and bounded claims; it remains a future evidence standard rather than completed model evidence.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--source:#4338ca;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--haz:#b91c1c;--iface:#7e22ce;--dec:#a16207;--hyp:#be185d}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--source:#a5b4fc;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--haz:#fb7185;--iface:#c084fc;--dec:#facc15;--hyp:#f472b6}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="720" rx="28"/><text x="70" y="70" class="fg" font-size="35" font-weight="800">MACHINE LEARNING — EVIDENCE PIPELINE</text><text x="70" y="104" class="muted" font-size="16">planned quality standard · current repository remains a learning scaffold</text><g transform="translate(70 160)" font-size="13" font-weight="700"><rect width="190" height="100" rx="16" fill="var(--source)"/><text x="95" y="38" text-anchor="middle" fill="var(--bg)">DATA</text><text x="95" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">source · units · rights</text><text x="95" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">missingness · target</text><path d="M190 50H245" stroke="var(--muted)" marker-end="url(#a)"/><rect x="255" width="190" height="100" rx="16" fill="var(--obs)"/><text x="350" y="38" text-anchor="middle" fill="var(--bg)">SPLIT</text><text x="350" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">train / validation / test</text><text x="350" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">leakage controls</text><path d="M445 50H500" stroke="var(--muted)" marker-end="url(#a)"/><rect x="510" width="190" height="100" rx="16" fill="var(--viable)"/><text x="605" y="38" text-anchor="middle" fill="var(--bg)">MODEL</text><text x="605" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">fθ(x) · loss L(θ)</text><text x="605" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">baseline first</text><path d="M700 50H755" stroke="var(--muted)" marker-end="url(#a)"/><rect x="765" width="190" height="100" rx="16" fill="var(--dec)"/><text x="860" y="38" text-anchor="middle" fill="var(--bg)">EVALUATE</text><text x="860" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">metric + baseline</text><text x="860" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">out-of-sample</text><path d="M955 50H1010" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1020" width="190" height="100" rx="16" fill="var(--unc)"/><text x="1115" y="38" text-anchor="middle" fill="var(--bg)">UNCERTAINTY</text><text x="1115" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">intervals · calibration</text><text x="1115" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">sensitivity</text><path d="M1210 50H1265" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1275" width="210" height="100" rx="16" fill="var(--state)"/><text x="1380" y="38" text-anchor="middle" fill="var(--bg)">BOUND CLAIM</text><text x="1380" y="62" text-anchor="middle" fill="var(--bg)" font-size="10">what result supports</text><text x="1380" y="80" text-anchor="middle" fill="var(--bg)" font-size="10">what it does not</text></g>
<rect x="70" y="320" width="700" height="280" rx="20" class="panel"/><text x="95" y="360" class="fg" font-size="20" font-weight="700">Mathematical contract for a mature project</text><text x="95" y="405" class="fg math" font-size="18">θ*=arg minθ Σᵢℓ(fθ(xᵢ),yᵢ)+λΩ(θ)</text><text x="95" y="443" class="fg math" font-size="18">R̂test=n_test⁻¹Σᵢℓ(fθ(xᵢ),yᵢ)</text><text x="95" y="481" class="fg math" font-size="18">ℙ(Y=1 | p̂≈p)≈p</text><path d="M105 552H725M105 552V495" stroke="var(--muted)"/><path d="M110 540C190 521 250 510 340 505C440 498 530 507 620 525S690 540 720 535" stroke="var(--state)" fill="none" stroke-width="3"/><path d="M105 520H725" stroke="var(--viable)" stroke-dasharray="7 5"/><text x="550" y="512" class="muted" font-size="11">reference / calibrated line</text>
<rect x="830" y="320" width="700" height="280" rx="20" class="panel"/><text x="855" y="360" class="fg" font-size="20" font-weight="700">Promotion gate: scaffold → evidence-bearing</text><g class="fg" font-size="14"><text x="870" y="405">1 · executable code + environment</text><text x="870" y="440">2 · source/data provenance</text><text x="870" y="475">3 · baseline + declared split strategy</text><text x="870" y="510">4 · metrics + uncertainty + sensitivity</text><text x="870" y="545">5 · reproducible outputs + limitations</text></g><rect x="1215" y="400" width="250" height="115" rx="16" fill="var(--hyp)" fill-opacity=".10" stroke="var(--hyp)" stroke-dasharray="7 6"/><text x="1340" y="438" text-anchor="middle" class="fg" font-size="15" font-weight="700">CURRENT STATUS</text><text x="1340" y="468" text-anchor="middle" class="muted" font-size="13">learning scaffold</text><text x="1340" y="493" text-anchor="middle" class="muted" font-size="12">no public model results yet</text><text x="70" y="660" class="muted" font-size="14">The figure is a quality contract, not evidence that these stages have been executed. Theme changes presentation only; status and claims remain invariant.</text></svg>