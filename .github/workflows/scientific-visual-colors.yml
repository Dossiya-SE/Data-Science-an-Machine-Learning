name: Scientific SVG white-canvas regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  white-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/verify_white_svg.py assets/ml-evidence-pipeline.svg
